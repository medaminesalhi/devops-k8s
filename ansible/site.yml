- name: Install Cosign on tools
  hosts: tools
  become: true
  roles:
    - role: cosign
      tags: cosign

- name: Configure application ServiceAccounts
  hosts: master1
  become: true
  roles:
    - role: app_serviceaccounts
      tags: app_serviceaccounts

- name: Install and configure Kyverno policies
  hosts: tools
  become: false
  roles:
