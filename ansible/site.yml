  hosts: masters
  become: true
  roles:
    - app_ingress

- name: Installer Gitea
  hosts: tools
  become: true
  roles:
    - gitea

- name: Deployer Jenkins dans Kubernetes
  hosts: masters
  become: true
  roles:
    - jenkins

- name: Finaliser la configuration CI/CD Gitea Jenkins
  hosts: tools
  become: true
  roles:
    - role: cicd_finalize
  tags: cicd_finalize

- name: Configure Gitea webhooks for Jenkins pipelines
  hosts: tools
  become: false
  roles:
    - role: gitea_webhook
  tags: gitea_webhook


- name: Prepare Helm client on tools
  hosts: tools
  become: true
  roles:
    - role: helm_client
      tags: helm_client

- name: Installer Prometheus dans Kubernetes
  hosts: tools
  become: true
  roles:
    - role: prometheus
      tags: prometheus

- name: Installer Grafana dans Kubernetes
  hosts: tools
  become: true
  roles:
    - role: grafana
      tags: grafana

- name: Install SonarQube on tools
  hosts: tools
  become: true
  roles:
    - role: sonarqube
      tags: sonarqube

- name: Installer Loki et Promtail dans Kubernetes
  hosts: tools
  become: true
  roles:
    - role: loki
      tags: loki

- name: Activer les audit logs Kubernetes
  hosts: masters
  become: true
  roles:
