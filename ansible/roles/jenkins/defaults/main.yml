jenkins_http_port: 8080
jenkins_home: /var/lib/jenkins
jenkins_admin_password_file: /var/lib/jenkins/secrets/initialAdminPassword

jenkins_java_package: openjdk-21-jre
jenkins_repo_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
jenkins_repo_key_path: /etc/apt/keyrings/jenkins-keyring.asc
jenkins_repo_file: /etc/apt/sources.list.d/jenkins.list
jenkins_repo_line: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
