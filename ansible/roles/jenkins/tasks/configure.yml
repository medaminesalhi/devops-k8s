- name: Attendre que le port Jenkins réponde
  wait_for:
    host: 127.0.0.1
    port: "{{ jenkins_http_port }}"
    delay: 5
    timeout: 300

- name: Vérifier que l'interface web Jenkins répond
  uri:
    url: "http://127.0.0.1:{{ jenkins_http_port }}"
    method: GET
    status_code: [200, 403]
  register: jenkins_http_check
  retries: 20
  delay: 5
  until: jenkins_http_check.status in [200, 403]

- name: Vérifier la présence du mot de passe admin initial
  stat:
    path: "{{ jenkins_admin_password_file }}"
  register: jenkins_admin_password_stat

- name: Lire le mot de passe admin initial Jenkins
  slurp:
    src: "{{ jenkins_admin_password_file }}"
  register: jenkins_admin_password_raw
  when: jenkins_admin_password_stat.stat.exists

- name: Définir le mot de passe admin initial Jenkins
  set_fact:
    jenkins_admin_password: "{{ jenkins_admin_password_raw.content | b64decode | trim }}"
  when: jenkins_admin_password_stat.stat.exists
