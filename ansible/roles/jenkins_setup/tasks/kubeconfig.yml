- name: Vérifier que le kubeconfig source existe
  stat:
    path: "{{ jenkins_kubeconfig_src }}"
  register: jenkins_kubeconfig_src_stat

- name: Échouer si le kubeconfig source n'existe pas
  fail:
    msg: "Le kubeconfig source {{ jenkins_kubeconfig_src }} est introuvable sur tools."
  when: not jenkins_kubeconfig_src_stat.stat.exists

- name: Créer le dossier .kube pour Jenkins
  file:
    path: "{{ jenkins_kube_dir }}"
    state: directory
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
    mode: "0700"

- name: Copier kubeconfig vers Jenkins
  copy:
    src: "{{ jenkins_kubeconfig_src }}"
    dest: "{{ jenkins_kubeconfig_dest }}"
    remote_src: yes
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
    mode: "0600"

- name: Vérifier kubectl avec le kubeconfig Jenkins
  shell: >
    su -s /bin/bash -c
    "{{ kubectl_binary_path }} --kubeconfig {{ jenkins_kubeconfig_dest }} get nodes"
    {{ jenkins_user }}
  register: jenkins_kubectl_check
  changed_when: false

- name: Afficher le test kubectl Jenkins
  debug:
    var: jenkins_kubectl_check.stdout_lines
