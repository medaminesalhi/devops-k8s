- name: Creer le fichier de configuration OpenSSL pour SAN
  copy:
    dest: "{{ nexus_tls_dir }}/openssl-san.cnf"
    mode: "0644"
    content: |
      [ req ]
      default_bits       = 2048
      prompt             = no
      default_md         = sha256
      x509_extensions    = v3_req
      distinguished_name = dn

      [ dn ]
      CN = {{ nexus_cert_common_name }}

      [ v3_req ]
      subjectAltName = @alt_names

      [ alt_names ]
      IP.1 = {{ nexus_host_ip }}

- name: Generer la cle privee TLS
  command: >
    openssl genrsa -out {{ nexus_tls_dir }}/nexus.key 2048
  args:
    creates: "{{ nexus_tls_dir }}/nexus.key"

- name: Generer le certificat auto-signe TLS avec SAN
  command: >
    openssl req -x509 -new -nodes
    -key {{ nexus_tls_dir }}/nexus.key
    -sha256 -days 365
    -out {{ nexus_tls_dir }}/nexus.crt
    -config {{ nexus_tls_dir }}/openssl-san.cnf
    -extensions v3_req
  args:
    creates: "{{ nexus_tls_dir }}/nexus.crt"
