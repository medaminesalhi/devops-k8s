---
- name: Verify kubectl access from tools
  command: kubectl get nodes
  become_user: vagrant
  register: prometheus_kubectl_nodes
  changed_when: false
  tags:
    - prometheus

- name: Display Kubernetes nodes before Prometheus installation
  debug:
    var: prometheus_kubectl_nodes.stdout_lines
  tags:
    - prometheus

- name: Verify Helm is installed on tools
  command: helm version --short
  register: prometheus_helm_version
  changed_when: false
  tags:
    - prometheus

- name: Display Helm version
  debug:
    var: prometheus_helm_version.stdout
  tags:
    - prometheus

- name: Ensure monitoring namespace exists
  command: kubectl create namespace {{ monitoring_namespace }}
  become_user: vagrant
  register: prometheus_namespace_create
  changed_when: "'created' in prometheus_namespace_create.stdout"
  failed_when:
    - prometheus_namespace_create.rc != 0
    - "'AlreadyExists' not in prometheus_namespace_create.stderr"
  tags:
    - prometheus

- name: Add Prometheus community Helm repository
  command: helm repo add {{ prometheus_chart_repo_name }} {{ prometheus_chart_repo_url }}
  become_user: vagrant
  register: prometheus_repo_add
  changed_when: "'has been added' in prometheus_repo_add.stdout"
  failed_when:
    - prometheus_repo_add.rc != 0
    - "'already exists' not in prometheus_repo_add.stderr"
  tags:
    - prometheus

- name: Update Helm repositories
  command: helm repo update
  become_user: vagrant
  changed_when: false
  tags:
    - prometheus

- name: Render kube-prometheus-stack values file
  template:
    src: kube-prometheus-values.yml.j2
    dest: "{{ prometheus_values_dest }}"
    owner: vagrant
    group: vagrant
    mode: "0644"
  tags:
    - prometheus

- name: Install or upgrade Prometheus with kube-prometheus-stack
  command: >
    helm upgrade --install {{ prometheus_release_name }} {{ prometheus_chart_name }}
    --namespace {{ monitoring_namespace }}
    --values {{ prometheus_values_dest }}
    --wait
    --timeout 15m
  become_user: vagrant
  register: prometheus_helm_install
  changed_when:
    - "'deployed' in prometheus_helm_install.stdout or 'upgraded' in prometheus_helm_install.stdout or 'Release' in prometheus_helm_install.stdout"
  tags:
    - prometheus

- name: Display Helm install output
  debug:
    var: prometheus_helm_install.stdout_lines
  tags:
    - prometheus

- name: Show Helm releases in monitoring namespace
  command: helm list -n {{ monitoring_namespace }}
  become_user: vagrant
  register: prometheus_helm_list
  changed_when: false
  tags:
    - prometheus

- name: Display Helm releases
  debug:
    var: prometheus_helm_list.stdout_lines
  tags:
    - prometheus

- name: Show monitoring pods
  command: kubectl get pods -n {{ monitoring_namespace }}
  become_user: vagrant
  register: prometheus_pods
  changed_when: false
  tags:
    - prometheus

- name: Display monitoring pods
  debug:
    var: prometheus_pods.stdout_lines
  tags:
    - prometheus

- name: Show Prometheus services
  command: kubectl get svc -n {{ monitoring_namespace }}
  become_user: vagrant
  register: prometheus_services
  changed_when: false
  tags:
    - prometheus

- name: Display Prometheus services
  debug:
    var: prometheus_services.stdout_lines
  tags:
    - prometheus
